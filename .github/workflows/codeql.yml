name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach existing code without a push.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Swift
    # Swift analysis has to build the code, and this is an AppKit app.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-codeql-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-codeql-swiftpm-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: swift build

      - name: Perform analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
