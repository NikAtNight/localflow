name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create after the release passes validation
        required: false
        type: string
      commit_sha:
        description: Commit to build for the tag; defaults to the dispatched ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, notarize, publish
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Select source revision
        id: source
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          COMMIT_SHA="${INPUT_COMMIT_SHA:-$DISPATCH_SHA}"
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: commit_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi
          echo "ref=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-release-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-release-swiftpm-

      - name: Run tests
        run: |
          set -euo pipefail
          bash Tests/ReleaseContractTests.sh
          swift test

      - name: Validate release contract
        id: contract
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ steps.source.outputs.ref }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/validate-release.sh preflight

      - name: Import signing certificate
        id: signing
        if: steps.contract.outputs.sign == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "error: imported certificate has no Developer ID Application identity" >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        env:
          APP_VERSION: ${{ steps.contract.outputs.version }}
          APP_SHORT_VERSION: ${{ steps.contract.outputs.short_version }}
          APP_BUNDLE_VERSION: ${{ steps.contract.outputs.bundle_version }}
          UPDATER_ENABLED: ${{ steps.contract.outputs.updater }}
          SKIP_PREWARM: "1"
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ./scripts/make-app.sh

      - name: Verify the on-device cleanup model is linked
        run: |
          set -euo pipefail
          if ! otool -L build/LocalFlow.app/Contents/MacOS/LocalFlow | grep -q FoundationModels; then
            echo "error: FoundationModels is not linked; command mode and cleanup would be missing" >&2
            exit 1
          fi

      - name: Notarize app
        if: steps.contract.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/LocalFlow.app "$RUNNER_TEMP/LocalFlow.zip"
          xcrun notarytool submit "$RUNNER_TEMP/LocalFlow.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple build/LocalFlow.app

      - name: Package DMG
        env:
          APP_VERSION: ${{ steps.contract.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Notarize DMG
        if: steps.contract.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          set -euo pipefail
          DMG="dist/LocalFlow-${APP_VERSION}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"

      - name: Verify signed artifacts
        env:
          APP_VERSION: ${{ steps.contract.outputs.version }}
          SIGNED: ${{ steps.contract.outputs.sign }}
        run: |
          set -euo pipefail
          DMG="dist/LocalFlow-${APP_VERSION}.dmg"
          codesign --verify --deep --strict --verbose=2 build/LocalFlow.app
          if [[ "$SIGNED" == "true" ]]; then
            spctl --assess --type execute --verbose=4 build/LocalFlow.app
            xcrun stapler validate build/LocalFlow.app
            xcrun stapler validate "$DMG"
          fi

      - name: Build Sparkle appcast
        if: steps.contract.outputs.updater == 'true'
        env:
          APP_VERSION: ${{ steps.contract.outputs.version }}
          RELEASE_TAG: ${{ steps.contract.outputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPCAST_TOOL: ${{ steps.contract.outputs.appcast_tool }}
        run: |
          set -euo pipefail
          mkdir -p sparkle-updates
          ditto -c -k --sequesterRsrc --keepParent \
            build/LocalFlow.app "sparkle-updates/LocalFlow-${APP_VERSION}.zip"

          if [[ -f CHANGELOG.md ]]; then
            awk -v version="$APP_VERSION" '
              $0 ~ "^## \\[" version "\\]" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "sparkle-updates/LocalFlow-${APP_VERSION}.html"
          fi

          "$APPCAST_TOOL" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${{ github.repository }}" \
            sparkle-updates <<< "$SPARKLE_PRIVATE_KEY"

          cp sparkle-updates/appcast.xml dist/appcast.xml
          cp "sparkle-updates/LocalFlow-${APP_VERSION}.zip" dist/

      - name: Build checksums
        env:
          APP_VERSION: ${{ steps.contract.outputs.version }}
          UPDATER_ENABLED: ${{ steps.contract.outputs.updater }}
        run: |
          set -euo pipefail
          cp scripts/setup-s1-mini.sh dist/setup-s1-mini.sh
          chmod 755 dist/setup-s1-mini.sh
          cd dist
          FILES=("LocalFlow-${APP_VERSION}.dmg" setup-s1-mini.sh)
          if [[ "$UPDATER_ENABLED" == "true" ]]; then
            FILES+=("LocalFlow-${APP_VERSION}.zip")
          fi
          shasum -a 256 "${FILES[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Validate release artifacts
        env:
          RELEASE_TAG: ${{ steps.contract.outputs.tag }}
          APP_VERSION: ${{ steps.contract.outputs.version }}
          APP_BUNDLE_PATH: build/LocalFlow.app
          VERIFY_CHECKSUMS: "true"
        run: ./scripts/validate-release.sh artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/LocalFlow-${{ steps.contract.outputs.version }}.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalFlow-${{ steps.contract.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/appcast.xml
            dist/SHA256SUMS.txt
            dist/setup-s1-mini.sh
          if-no-files-found: error
          retention-days: 14

      - name: Create verified draft release
        if: steps.contract.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.contract.outputs.version }}
          RELEASE_TAG: ${{ steps.contract.outputs.tag }}
          COMMIT_SHA: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if [[ -f CHANGELOG.md ]]; then
            awk -v version="$APP_VERSION" '
              $0 ~ "^## \\[" version "\\]" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [[ ! -s "$NOTES_FILE" ]]; then
            printf 'LocalFlow %s\n' "$APP_VERSION" > "$NOTES_FILE"
          fi

          EXISTING="$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft] | @tsv" \
            | head -1)"
          if [[ -n "$EXISTING" && "$EXISTING" != *$'\ttrue' ]]; then
            echo "error: refusing to replace already-published release $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -z "$EXISTING" ]]; then
            CREATE_ARGS=(--draft --target "$COMMIT_SHA" --title "$RELEASE_TAG" --notes-file "$NOTES_FILE")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${CREATE_ARGS[@]}"
          fi

          ASSETS=(
            "dist/LocalFlow-${APP_VERSION}.dmg"
            "dist/LocalFlow-${APP_VERSION}.zip"
            "dist/appcast.xml"
            "dist/SHA256SUMS.txt"
            "dist/setup-s1-mini.sh"
          )
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber

      - name: Publish complete release
        if: steps.contract.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.contract.outputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED=$'LocalFlow-${{ steps.contract.outputs.version }}.dmg\nLocalFlow-${{ steps.contract.outputs.version }}.zip\nSHA256SUMS.txt\nappcast.xml\nsetup-s1-mini.sh'
          ACTUAL="$(gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' | sort)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "error: draft release assets do not match the required set" >&2
            diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ACTUAL") || true
            exit 1
          fi

          PUBLISH_ARGS=(--draft=false)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            PUBLISH_ARGS+=(--prerelease)
          else
            PUBLISH_ARGS+=(--latest)
          fi
          gh release edit "$RELEASE_TAG" "${PUBLISH_ARGS[@]}"
