name: Release

on:
  # Publish a GitHub Release (tag it v1.2.3) to build and attach the DMG.
  release:
    types: [published]
  # Or run manually to produce an unpublished build for testing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign, notarize
    # Apple silicon: LocalFlow ships arm64-only (see README requirements),
    # and the on-device cleanup model needs a recent SDK.
    runs-on: macos-26
    permissions:
      contents: write # attach the DMG to the release
      id-token: write # Sigstore signing for build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA:0:7}"
            TAG=""
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-release-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-release-swiftpm-

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        id: signing
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MAC_CERT_P12_BASE64:-}" || -z "${MAC_CERT_PASSWORD:-}" ]]; then
            echo "No signing certificate in secrets: building ad-hoc." >&2
            echo "Downloaded ad-hoc builds are blocked by Gatekeeper until the" >&2
            echo "user right-clicks Open, and cannot be notarized." >&2
            echo "sign=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "error: no Developer ID Application identity in the imported certificate" >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "sign=true" >> "$GITHUB_OUTPUT"
          echo "Imported: $IDENTITY"

      - name: Build app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          # No model cache on a fresh runner, and pre-warming would download
          # gigabytes of CoreML weights for no benefit to the shipped build.
          SKIP_PREWARM: "1"
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ./scripts/make-app.sh

      - name: Verify the on-device cleanup model is linked
        run: |
          set -euo pipefail
          # FoundationModels is behind `#if canImport`. An older SDK compiles
          # cleanly and silently ships a build with no Apple Intelligence
          # cleanup and no command mode, so assert it actually linked.
          if ! otool -L build/LocalFlow.app/Contents/MacOS/LocalFlow | grep -q FoundationModels; then
            echo "error: FoundationModels is not linked — the runner's SDK is too old." >&2
            echo "Command mode and on-device cleanup would be missing from this build." >&2
            exit 1
          fi
          echo "FoundationModels linked."

      - name: Notarize
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "::warning::Notarization credentials missing — shipping signed but un-notarized."
            exit 0
          fi
          ditto -c -k --sequesterRsrc --keepParent build/LocalFlow.app "$RUNNER_TEMP/LocalFlow.zip"
          xcrun notarytool submit "$RUNNER_TEMP/LocalFlow.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          # Staple so Gatekeeper clears the app without a network round trip.
          xcrun stapler staple build/LocalFlow.app

      - name: Package DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Notarize DMG
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_ID:-}" ]]; then exit 0; fi
          DMG="dist/LocalFlow-${APP_VERSION}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"

      - name: Verify artifacts
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.sign }}
        run: |
          set -euo pipefail
          DMG="dist/LocalFlow-${APP_VERSION}.dmg"
          codesign --verify --deep --strict --verbose=2 build/LocalFlow.app
          if [[ "$SIGNED" == "true" ]]; then
            # The check that actually predicts the user's experience: would
            # Gatekeeper let this run after download?
            spctl --assess --type execute --verbose=4 build/LocalFlow.app
            xcrun stapler validate build/LocalFlow.app || \
              echo "::warning::App is not stapled (un-notarized build)."
            xcrun stapler validate "$DMG" || \
              echo "::warning::DMG is not stapled (un-notarized build)."
          fi

      # Sparkle installs from a ZIP, not the DMG, and needs an appcast whose
      # entry is EdDSA-signed with the key whose public half is baked into
      # Info.plist. Without a valid signature the running app refuses the
      # update, which is the point.
      - name: Build Sparkle appcast
        if: steps.version.outputs.is_release == 'true' && steps.signing.outputs.sign == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::warning::SPARKLE_PRIVATE_KEY not set - shipping without an appcast, so existing installs will not auto-update."
            exit 0
          fi

          BIN="$(find .build/artifacts -type d -name bin -path '*sparkle*' -print -quit)"
          if [[ -z "$BIN" ]]; then
            echo "error: Sparkle tools not found in .build/artifacts" >&2
            exit 1
          fi

          # generate_appcast wants a directory of archives to describe.
          mkdir -p sparkle-updates
          ditto -c -k --sequesterRsrc --keepParent \
            build/LocalFlow.app "sparkle-updates/LocalFlow-${APP_VERSION}.zip"

          # Release notes become the "what's new" body Sparkle shows.
          if [[ -n "${RELEASE_NOTES:-}" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "sparkle-updates/LocalFlow-${APP_VERSION}.html"
          fi

          "$BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            --link "https://github.com/${{ github.repository }}" \
            sparkle-updates <<< "$SPARKLE_PRIVATE_KEY"

          cp sparkle-updates/appcast.xml dist/appcast.xml
          cp "sparkle-updates/LocalFlow-${APP_VERSION}.zip" dist/
          echo "Appcast entries:"
          grep -c "<item>" dist/appcast.xml
          grep -o 'sparkle:edSignature="[^"]\{0,12\}' dist/appcast.xml | head -1

      - name: Checksum
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 *.dmg *.zip 2>/dev/null > SHA256SUMS.txt || shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Cryptographic proof that this DMG came out of this workflow, from
      # this commit. Users verify with:
      #   gh attestation verify LocalFlow-<v>.dmg --repo <owner>/<repo>
      # Notarization proves Apple checked it; this proves where it came from.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/LocalFlow-${{ steps.version.outputs.version }}.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalFlow-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Attach DMG to the release
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS=("dist/LocalFlow-${APP_VERSION}.dmg" "dist/SHA256SUMS.txt")
          # appcast.xml must be attached for the feed URL
          # (/releases/latest/download/appcast.xml) to resolve, and the ZIP is
          # what the appcast points existing installs at.
          [[ -f dist/appcast.xml ]] && ASSETS+=("dist/appcast.xml")
          [[ -f "dist/LocalFlow-${APP_VERSION}.zip" ]] && ASSETS+=("dist/LocalFlow-${APP_VERSION}.zip")
          gh release upload "${{ steps.version.outputs.tag }}" "${ASSETS[@]}" \
            --repo "${{ github.repository }}" --clobber
