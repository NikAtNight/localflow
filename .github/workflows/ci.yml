name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access to the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          # Non-ASCII in these scripts is not cosmetic. An ellipsis directly
          # after "$OUT" was parsed into the variable NAME under the runner's
          # C locale, so `set -u` aborted the release build while the same
          # script ran fine in a UTF-8 shell locally.
          #
          # perl, not grep: BSD grep (what macOS ships) does not understand
          # \x escapes in a bracket expression and silently matches almost
          # every line, so a grep-based version of this check passed locally
          # against GNU/ugrep and then failed CI on a clean tree.
          OFFENDERS="$(perl -ne 'print "$ARGV:$.: $_" if /[^\x00-\x7F]/' scripts/*.sh)"
          if [[ -n "$OFFENDERS" ]]; then
            echo "$OFFENDERS"
            echo "error: non-ASCII characters found in shell scripts (see above)" >&2
            exit 1
          fi
          echo "scripts are ASCII-clean"

      - name: Test release contract
        run: |
          swift package resolve
          bash Tests/ReleaseContractTests.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test
