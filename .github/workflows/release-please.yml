name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # maintain the release PR branch and changelog commit
      pull-requests: write # maintain the release PR
    steps:
      # Keeps an open "chore: release X.Y.Z" PR that accumulates changes on
      # main. This workflow deliberately leaves tagging and publication to the
      # artifact workflow so an incomplete release is never public.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          skip-github-release: true

      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect merged release PR
        if: github.event_name == 'push'
        id: merged-release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MANIFEST=.github/.release-please-manifest.json
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "error: BEFORE_SHA does not identify an available commit" >&2
            exit 1
          fi
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             ! git cat-file -e "$COMMIT_SHA^{commit}" 2>/dev/null; then
            echo "error: COMMIT_SHA does not identify an available commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$BEFORE_SHA" "$COMMIT_SHA"; then
            echo "error: BEFORE_SHA is not an ancestor of COMMIT_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$COMMIT_SHA" ]]; then
            echo "error: the checkout does not match COMMIT_SHA" >&2
            exit 1
          fi
          if ! git cat-file -e "$BEFORE_SHA:$MANIFEST" 2>/dev/null || \
             ! git cat-file -e "$COMMIT_SHA:$MANIFEST" 2>/dev/null; then
            echo "error: release manifest is unavailable across the pushed revision range" >&2
            exit 1
          fi

          if git diff --quiet "$BEFORE_SHA" "$COMMIT_SHA" -- "$MANIFEST"; then
            echo "A normal main-branch push; no release build to dispatch."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            DIFF_STATUS=$?
            if [[ "$DIFF_STATUS" -ne 1 ]]; then
              echo "error: could not verify the release manifest transition" >&2
              exit 1
            fi
          fi

          BEFORE_VERSION="$(git show "$BEFORE_SHA:$MANIFEST" | jq -er '.["."]')"
          VERSION="$(git show "$COMMIT_SHA:$MANIFEST" | jq -er '.["."]')"
          if [[ "$VERSION" == "$BEFORE_VERSION" ]]; then
            echo "error: release manifest changed without advancing the root version" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.[0-9]+)?$ ]]; then
            echo "error: release manifest contains an unsupported version: $VERSION" >&2
            exit 1
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release before publication
        if: steps.merged-release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/dispatches" \
            -f event_type=release-build \
            -f "client_payload[before_sha]=$BEFORE_SHA"
