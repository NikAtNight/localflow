name: Release Please

on:
  push:
    branches: [main]
  # Re-run by hand after fixing something (the first run failed on a repo
  # setting rather than on the commit history).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # maintain the release PR branch and changelog commit
      pull-requests: write # maintain the release PR
    steps:
      # Keeps an open "chore: release X.Y.Z" PR that accumulates changes on
      # main. This workflow deliberately leaves tagging and publication to the
      # artifact workflow so an incomplete release is never public.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          skip-github-release: true

      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - name: Detect merged release PR
        if: github.event_name == 'push'
        id: merged-release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MANIFEST=.github/.release-please-manifest.json
          if git diff --quiet "$BEFORE_SHA" "$COMMIT_SHA" -- "$MANIFEST"; then
            echo "A normal main-branch push; no release build to dispatch."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(jq -er '.["."]' "$MANIFEST")"
          TAG="v$VERSION"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.[0-9]+)?$ ]]; then
            echo "error: release manifest contains an unsupported version: $VERSION" >&2
            exit 1
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release before publication
        if: steps.merged-release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.merged-release.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/dispatches" \
            -f event_type=release-build \
            -f "client_payload[tag]=$RELEASE_TAG" \
            -f "client_payload[commit_sha]=$COMMIT_SHA"
