name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.merged-release.outputs.created }}
      release_tag: ${{ steps.merged-release.outputs.tag }}
    permissions:
      contents: write # maintain the release PR branch and changelog commit
      pull-requests: write # maintain the release PR
    steps:
      # Keeps an open "chore: release X.Y.Z" PR that accumulates changes on
      # main. This workflow deliberately leaves tagging and publication to the
      # artifact workflow so an incomplete release is never public.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          skip-github-release: true

      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect merged release PR
        if: github.event_name == 'push'
        id: merged-release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MANIFEST=.github/.release-please-manifest.json
          semver_is_greater() {
            local before="$1"
            local after="$2"
            local pattern='^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$'
            local before_major before_minor before_patch before_stage before_number
            local after_major after_minor after_patch after_stage after_number
            local component before_rank after_rank

            [[ "$before" =~ $pattern ]] || return 2
            before_major="${BASH_REMATCH[1]}"
            before_minor="${BASH_REMATCH[2]}"
            before_patch="${BASH_REMATCH[3]}"
            before_stage="${BASH_REMATCH[5]:-}"
            before_number="${BASH_REMATCH[6]:-0}"
            [[ "$after" =~ $pattern ]] || return 2
            after_major="${BASH_REMATCH[1]}"
            after_minor="${BASH_REMATCH[2]}"
            after_patch="${BASH_REMATCH[3]}"
            after_stage="${BASH_REMATCH[5]:-}"
            after_number="${BASH_REMATCH[6]:-0}"

            for component in \
              "$before_major" "$before_minor" "$before_patch" "$before_number" \
              "$after_major" "$after_minor" "$after_patch" "$after_number"
            do
              if [[ ${#component} -gt 1 && "$component" == 0* ]]; then
                return 2
              fi
            done
            if [[ -n "$before_stage" && "$before_number" == 0 ]] || \
               [[ -n "$after_stage" && "$after_number" == 0 ]]; then
              return 2
            fi
            if [[ ${#before_major} -gt 4 || ${#after_major} -gt 4 || \
                  ${#before_minor} -gt 2 || ${#after_minor} -gt 2 || \
                  ${#before_patch} -gt 2 || ${#after_patch} -gt 2 || \
                  ${#before_number} -gt 3 || ${#after_number} -gt 3 ]]; then
              return 2
            fi

            if (( 10#$after_major > 10#$before_major )); then return 0; fi
            if (( 10#$after_major < 10#$before_major )); then return 1; fi
            if (( 10#$after_minor > 10#$before_minor )); then return 0; fi
            if (( 10#$after_minor < 10#$before_minor )); then return 1; fi
            if (( 10#$after_patch > 10#$before_patch )); then return 0; fi
            if (( 10#$after_patch < 10#$before_patch )); then return 1; fi

            if [[ -z "$before_stage" ]]; then
              [[ -n "$after_stage" ]] && return 1
              return 1
            fi
            [[ -z "$after_stage" ]] && return 0
            case "$before_stage" in alpha) before_rank=1 ;; beta) before_rank=2 ;; rc) before_rank=3 ;; esac
            case "$after_stage" in alpha) after_rank=1 ;; beta) after_rank=2 ;; rc) after_rank=3 ;; esac
            if (( after_rank > before_rank )); then return 0; fi
            if (( after_rank < before_rank )); then return 1; fi
            (( 10#$after_number > 10#$before_number ))
          }

          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "error: BEFORE_SHA does not identify an available commit" >&2
            exit 1
          fi
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             ! git cat-file -e "$COMMIT_SHA^{commit}" 2>/dev/null; then
            echo "error: COMMIT_SHA does not identify an available commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$BEFORE_SHA" "$COMMIT_SHA"; then
            echo "error: BEFORE_SHA is not an ancestor of COMMIT_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$COMMIT_SHA" ]]; then
            echo "error: the checkout does not match COMMIT_SHA" >&2
            exit 1
          fi
          if ! git cat-file -e "$BEFORE_SHA:$MANIFEST" 2>/dev/null || \
             ! git cat-file -e "$COMMIT_SHA:$MANIFEST" 2>/dev/null; then
            echo "error: release manifest is unavailable across the pushed revision range" >&2
            exit 1
          fi

          if git diff --quiet "$BEFORE_SHA" "$COMMIT_SHA" -- "$MANIFEST"; then
            echo "A normal main-branch push; no release build to dispatch."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            DIFF_STATUS=$?
            if [[ "$DIFF_STATUS" -ne 1 ]]; then
              echo "error: could not verify the release manifest transition" >&2
              exit 1
            fi
          fi

          BEFORE_VERSION="$(git show "$BEFORE_SHA:$MANIFEST" | jq -er '.["."]')"
          VERSION="$(git show "$COMMIT_SHA:$MANIFEST" | jq -er '.["."]')"
          if semver_is_greater "$BEFORE_VERSION" "$VERSION"; then
            :
          else
            VERSION_STATUS=$?
            if [[ "$VERSION_STATUS" -eq 2 ]]; then
              echo "error: release manifest contains an unsupported semantic version" >&2
            else
              echo "error: release version $VERSION must be greater than $BEFORE_VERSION" >&2
            fi
            exit 1
          fi
          TAG="v$VERSION"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.[0-9]+)?$ ]]; then
            echo "error: release manifest contains an unsupported version: $VERSION" >&2
            exit 1
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: Build release before publication
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  mark-release-pr-published:
    name: Mark release PR published
    needs: [release-please, release]
    if: needs.release-please.outputs.release_created == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Mark release PR published
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PENDING_LABEL='autorelease: pending'
          PUBLISHED_LABEL='autorelease: published'

          RELEASE="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish)"
          if [[ "$(jq -r '.isDraft' <<< "$RELEASE")" != false ]]; then
            echo "error: release $RELEASE_TAG is not public" >&2
            exit 1
          fi
          if [[ "$(jq -r '.targetCommitish' <<< "$RELEASE")" != "$COMMIT_SHA" ]]; then
            echo "error: release $RELEASE_TAG does not target $COMMIT_SHA" >&2
            exit 1
          fi

          PULLS="$(gh \
            api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/pulls" \
            | jq -s 'add // []')"
          CANDIDATES="$(jq \
            --arg sha "$COMMIT_SHA" \
            --arg pending "$PENDING_LABEL" \
            --arg published "$PUBLISHED_LABEL" \
            '[.[] | select(
              .state == "closed" and
              .merged_at != null and
              .merge_commit_sha == $sha and
              .base.ref == "main" and
              any(.labels[]?; .name == $pending or .name == $published)
            )]' <<< "$PULLS")"
          CANDIDATE_COUNT="$(jq 'length' <<< "$CANDIDATES")"
          if [[ "$CANDIDATE_COUNT" -ne 1 ]]; then
            echo "error: expected one release PR for $COMMIT_SHA, found $CANDIDATE_COUNT" >&2
            exit 1
          fi

          PR_NUMBER="$(jq -er '.[0].number' <<< "$CANDIDATES")"
          HAS_PENDING="$(jq -r --arg label "$PENDING_LABEL" \
            'any(.[0].labels[]?; .name == $label)' <<< "$CANDIDATES")"
          HAS_PUBLISHED="$(jq -r --arg label "$PUBLISHED_LABEL" \
            'any(.[0].labels[]?; .name == $label)' <<< "$CANDIDATES")"

          if [[ "$HAS_PUBLISHED" != true ]]; then
            if ! gh \
              api "repos/$GITHUB_REPOSITORY/labels/autorelease%3A%20published" \
              >/dev/null 2>&1
            then
              if ! gh \
                api --method POST \
                "repos/$GITHUB_REPOSITORY/labels" \
                -f "name=$PUBLISHED_LABEL" \
                -f 'color=0e8a16' \
                -f 'description=Release has been published' \
                >/dev/null 2>&1
              then
                echo "Repository label creation failed; checking for a concurrent create." >&2
              fi
              if ! gh \
                api "repos/$GITHUB_REPOSITORY/labels/autorelease%3A%20published" \
                >/dev/null 2>&1
              then
                echo "error: repository label $PUBLISHED_LABEL is unavailable" >&2
                exit 1
              fi
            fi
            gh \
              api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
              -f "labels[]=$PUBLISHED_LABEL" >/dev/null
          fi
          if [[ "$HAS_PENDING" == true ]]; then
            gh \
              api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/autorelease%3A%20pending" \
              >/dev/null
          fi

          FINAL_PR="$(gh \
            api \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER")"
          if ! jq -e \
            --arg pending "$PENDING_LABEL" \
            --arg published "$PUBLISHED_LABEL" \
            '([.labels[].name] | index($published)) != null and
             ([.labels[].name] | index($pending)) == null' \
            <<< "$FINAL_PR" >/dev/null
          then
            echo "error: release PR #$PR_NUMBER labels did not reach published state" >&2
            exit 1
          fi
